<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meeting Saathi — Admin Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Meeting Saathi</h1>
  <p class="muted">Admin login.</p>

  {% if error %}
    <p class="muted" style="color:#c53030;">Wrong username or password. Try again.</p>
  {% endif %}

  <form method="post" action="/{{ slug }}/login" class="start-form">
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
