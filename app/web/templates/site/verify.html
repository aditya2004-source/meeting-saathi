{% extends "site/base.html" %}
{% block content %}
<div class="panel">
  {% include "site/_onboarding_progress.html" %}
  <div class="panel-card">
    <h1>Verify your email</h1>
    <div class="notice success">Terms &amp; consent confirmed. We emailed a code to {{ email }}.</div>
    <div class="field">
      <label for="code">Verification code</label>
      <input id="code" inputmode="numeric" maxlength="6" placeholder="123456" style="letter-spacing:6px;text-align:center;font-size:1.3rem;">
    </div>
    <div id="error" class="error-text" hidden></div>
    <button class="btn primary block" onclick="verify()">Verify</button>
  </div>
</div>
<script>
const email = {{ email | tojson }};

async function verify() {
  const code = document.getElementById('code').value.trim();
  const errorEl = document.getElementById('error');
  errorEl.hidden = true;
  const response = await fetch('/auth/verify-otp', {method: 'POST', body: new URLSearchParams({email, code})});
  if (!response.ok) {
    errorEl.textContent = 'That code is incorrect or has expired -- please try again.';
    errorEl.hidden = false;
    return;
  }
  window.location.href = '/welcome';
}
</script>
{% endblock %}
