{% extends "site/base.html" %}
{% block content %}
<div class="panel">
  <div class="panel-card" id="email-step">
    <h1>Log in</h1>
    <p class="lead-sm">We'll email you a one-time verification code.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com">
    </div>
    <div id="error" class="error-text" hidden></div>
    <button class="btn primary block" onclick="sendCode()">Send Code</button>
    <p style="font-size:0.82rem;color:var(--ms-muted);text-align:center;margin:var(--ms-space-4) 0 0;">New here? <a href="/signup">Create an account</a></p>
  </div>
  <div class="panel-card" id="code-step" hidden>
    <h1>Enter your code</h1>
    <div class="notice success" id="code-notice"></div>
    <div class="field">
      <label for="code">Verification code</label>
      <input id="code" inputmode="numeric" maxlength="6" placeholder="123456" style="letter-spacing:6px;text-align:center;font-size:1.3rem;">
    </div>
    <div id="code-error" class="error-text" hidden></div>
    <button class="btn primary block" onclick="verifyCode()">Log In</button>
  </div>
</div>
<script>
let loginEmail = '';
// Server-validated in app.site_routes.login_page (_safe_next_path) before
// ever reaching this page -- always a same-site path, never open-redirect-able.
const loginNextPath = {{ next | tojson }};

async function sendCode() {
  loginEmail = document.getElementById('email').value.trim();
  const errorEl = document.getElementById('error');
  errorEl.hidden = true;
  if (!loginEmail) {
    errorEl.textContent = 'Please enter your email.';
    errorEl.hidden = false;
    return;
  }
  const response = await fetch('/auth/send-otp', {method: 'POST', body: new URLSearchParams({email: loginEmail})});
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    if (body.detail === 'consent_required') {
      errorEl.textContent = "We don't recognize that email yet -- please create an account first.";
    } else if (body.detail === 'too_many_requests') {
      errorEl.textContent = 'Too many attempts -- please wait a few minutes and try again.';
    } else {
      errorEl.textContent = 'Could not send a code -- please try again.';
    }
    errorEl.hidden = false;
    return;
  }
  document.getElementById('code-notice').textContent = `We emailed a code to ${loginEmail}.`;
  document.getElementById('email-step').hidden = true;
  document.getElementById('code-step').hidden = false;
}

async function verifyCode() {
  const code = document.getElementById('code').value.trim();
  const errorEl = document.getElementById('code-error');
  errorEl.hidden = true;
  const response = await fetch('/auth/verify-otp', {method: 'POST', body: new URLSearchParams({email: loginEmail, code})});
  if (!response.ok) {
    errorEl.textContent = 'That code is incorrect or has expired -- please try again.';
    errorEl.hidden = false;
    return;
  }
  window.location.href = loginNextPath;
}
</script>
{% endblock %}
