{% extends "site/base.html" %}
{% block content %}
<div class="panel">
  {% include "site/_onboarding_progress.html" %}
  <div class="panel-card">
    <h1>Create your account</h1>
    <p class="lead-sm">Start with 3 free meetings. No card required.</p>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" placeholder="Your name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com">
    </div>
    <div id="error" class="error-text" hidden></div>
    <button class="btn primary block" onclick="continueSignup()">Continue</button>
    <p style="font-size:0.82rem;color:var(--ms-muted);text-align:center;margin:var(--ms-space-4) 0 0;">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
<script>
async function continueSignup() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const errorEl = document.getElementById('error');
  errorEl.hidden = true;
  if (!name || !email) {
    errorEl.textContent = 'Please enter your name and email.';
    errorEl.hidden = false;
    return;
  }
  const body = new URLSearchParams({name, email});
  const response = await fetch('/auth/signup', {method: 'POST', body});
  if (!response.ok) {
    errorEl.textContent = 'Something went wrong -- please try again.';
    errorEl.hidden = false;
    return;
  }
  window.location.href = `/signup/consent?email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}`;
}
</script>
{% endblock %}
